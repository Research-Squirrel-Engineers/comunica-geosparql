	geofqueries={
"http://www.opengis.net/def/function/geosparql/buffer":`PREFIX my: <http://example.org/ApplicationSchema#>
PREFIX geo: <"""+str(GEO)+""">
PREFIX geof: <"""+str(GEOF)+""">
PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>
SELECT ?buffer
WHERE {
  my:A geo:hasDefaultGeometry ?aGeom .
  ?aGeom %%literalrel1%% ?aLiteral .
  BIND (geof:buffer(?aLiteral,"5.0"^^xsd:double,<http://www.ontology-of-units-of-measure.org/resource/om-2/meter>) as ?buffer)
}`,
"http://www.opengis.net/def/function/geosparql/maxX":`PREFIX my: <http://example.org/ApplicationSchema#>
PREFIX geo: <http://www.opengis.net/ont/geosparql#>
PREFIX geof: <http://www.opengis.net/def/function/geosparql/>
SELECT ?literal ?maxX
WHERE {
  my:AExactGeom geo:asWKT ?literal .
  BIND(geof:maxX(?literal) AS ?maxX)
}`,
"http://www.opengis.net/def/function/geosparql/maxY":`PREFIX my: <http://example.org/ApplicationSchema#>
PREFIX geo: <http://www.opengis.net/ont/geosparql#>
PREFIX geof: <http://www.opengis.net/def/function/geosparql/>
SELECT ?literal ?maxY
WHERE {
  my:AExactGeom geo:asWKT ?literal .
  BIND(geof:maxY(?literal) AS ?maxY)
}`,
"http://www.opengis.net/def/function/geosparql/maxZ":`PREFIX my: <http://example.org/ApplicationSchema#>
PREFIX geo: <http://www.opengis.net/ont/geosparql#>
PREFIX geof: <http://www.opengis.net/def/function/geosparql/>
SELECT ?literal ?maxZ
WHERE {
  my:AExactGeom geo:asWKT ?literal .
  BIND(geof:maxZ(?literal) AS ?maxZ)
}`,
"http://www.opengis.net/def/function/geosparql/minX":`PREFIX my: <http://example.org/ApplicationSchema#>
PREFIX geo: <http://www.opengis.net/ont/geosparql#>
PREFIX geof: <http://www.opengis.net/def/function/geosparql/>
SELECT ?literal ?minX

"http://www.opengis.net/def/function/geosparql/minY":`PREFIX my: <http://example.org/ApplicationSchema#>

  BIND(geof:minZ(?literal) AS ?minZ)
}`}

function showQuery(){
  if(document.getElementById("functions").value in geofqueries){
    yasgui.getTab().yasqe.setValue(geofqueries[document.getElementById("functions").value])
  }
}


 const endpoint = "https://situx.github.io/comunica-geosparql/testdata.ttl"
const urlParams = new URLSearchParams(window.location.search);
const prefixes=`
SELECT * WHERE {
  ?sub ?pred ?obj .
} LIMIT 10`

 const myEngine=new Comunica.QueryEngine()
async function queryFile(){
  yasres={"head":{"vars":[]},"results":{"bindings":[]}}
  config={"sources":[endpoint]}
  const result=await myEngine.queryBindings(yasgui.getTab().yasqe.getValue(), config)
  const data=await result.toArray()	
  vararray=[]
  ttypemap={"NamedNode":"uri","Literal":"literal"}
  for(bind of data){
	curbindings={}
	for(entry of bind["entries"]["_root"]["entries"]){
		if(!(vararray.includes(entry[0]))){
			vararray.push(entry[0])
		}
		curbindings[entry[0]]={"type":ttypemap[entry[1]["termType"]],"value":entry[1]["value"]}	
		if("datatype" in entry[1]){
			curbindings[entry[0]]["datatype"]=entry[1]["datatype"]["value"]
		}
		if("language" in entry[1] && entry[1]["language"]!=""){
			curbindings[entry[0]]["language"]=entry[1]["language"]
		}
			
	}
	yasres["results"]["bindings"].push(curbindings)
  }
  yasres["head"]["vars"]=vararray
	yasgui.getTab().yasr.setResponse({
	  data: yasres,
	  contentType: "application/sparql-results+json",
	  status: 200,
	  executionTime: 1000 // ms
	  // error to show
	})  		

}
</script>
