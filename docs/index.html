    geof={
        "http://www.opengis.net/def/function/geosparql/boundary":"geof:boundary",
        "http://www.opengis.net/def/function/geosparql/difference":"geof:difference",
        "http://www.opengis.net/def/function/geosparql/distance":"geof:distance",
        "http://www.opengis.net/def/function/geosparql/maxX":"geof:maxX",
        "http://www.opengis.net/def/function/geosparql/maxY":"geof:maxY",
        "http://www.opengis.net/def/function/geosparql/maxZ":"geof:maxZ",
        "http://www.opengis.net/def/function/geosparql/minX":"geof:minX",
        "http://www.opengis.net/def/function/geosparql/minY":"geof:minY",
        "http://www.opengis.net/def/function/geosparql/minZ":"geof:minZ",
        "http://www.opengis.net/def/function/geosparql/symDifference":"geof:symDifference",
    }
	geofqueries={"http://www.opengis.net/def/function/geosparql/maxX":`PREFIX my: <http://example.org/ApplicationSchema#>
PREFIX geo: <http://www.opengis.net/ont/geosparql#>
PREFIX geof: <http://www.opengis.net/def/function/geosparql/>
SELECT ?literal ?maxX
WHERE {
  my:AExactGeom geo:asWKT ?literal .
  BIND(geof:maxX(?literal) AS ?maxX)
}`}
    var prefixList="PREFIX owl: <http://www.w3.org/2002/07/owl#>\nPREFIX geo: <http://www.opengis.net/ont/geosparql#>\nPREFIX wd: <http://www.wikidata.org/entity/>\nPREFIX foaf: <http://xmlns.com/foaf/0.1/>\nPREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>\nPREFIX xml: <http://www.w3.org/XML/1998/namespace>\nPREFIX xsd: <http://www.w3.org/2001/XMLSchema#>\nPREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>\nPREFIX xerl: <http://www.xerleben.de/schema/2.0_1#>\nPREFIX xplan5: <http://www.xplanung.de/xplangml/5/0#>\nPREFIX semgis: <http://www.semgis.de/geodata#> "

var overlayMaps={}

async function execQuery(){
thequery=geofqueries[geodocument.getElementById('functions').value]
console.log(thequery)
new Comunica.QueryEngine().queryBindings(thequery, {
  sources: ['https://situx.github.io/comunica-geosparql/testdata.ttl'],
}).then(function (bindingsStream) {
  bindingsStream.on('data', function (data) {
    // Each variable binding is an RDFJS term
    console.log(data);
  });
});
}
execQuery()
</script>

 transparent: true,

});
	var baseMaps = {
    "BKG": wmsLayer,
        "OSM": layer
	};

	position: 'bottomright',
	imperial: false
}).addTo(mymap);
var layercontrol=L.control.layers(baseMaps,overlayMaps).addTo(mymap);
